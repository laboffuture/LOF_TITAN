name: Deploy Web Application to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Grant GITHUB_TOKEN permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Webapp Dependencies
        run: npm install
        working-directory: webapp

      - name: Build Webapp
        run: npm run build
        working-directory: webapp
        env:
          # Where the deployed site should send /api requests.
          #
          # GitHub Pages is static - it cannot run the Express API - so without
          # this the built site calls a path that does not exist and sign-in
          # fails with "API not responding". Set a repository variable named
          # VITE_API_URL (Settings -> Secrets and variables -> Actions ->
          # Variables) to the API origin, e.g. https://titan.example.com/api
          #
          # Note this makes the session cookie CROSS-SITE (github.io calling
          # another domain), which needs SameSite=None; Secure on the server and
          # is still blocked by Safari/iOS. Serving the frontend from the same
          # origin as the API is the arrangement that actually works everywhere.
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
