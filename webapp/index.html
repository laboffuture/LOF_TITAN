<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <!-- Leading slash so Vite rewrites it with the deploy base. Without it the
         href resolves against the current route, so a deep link like
         /LOF_TITAN/kit/rc-plane asked for /LOF_TITAN/kit/favicon.png. -->
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOF TITAN Dashboard</title>
  <!-- Theme before first paint: the saved choice (key "lof-theme"), otherwise the
       system setting. Runs ahead of the stylesheet so there is no light flash. -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('lof-theme'); } catch (e) { /* storage blocked */ }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- No crossorigin: our <img> tags fetch without it, and a preconnect that
         disagrees opens a second connection instead of being reused. -->
  <link rel="preconnect" href="https://res.cloudinary.com">

  <!-- The first carousel slide is deliberately NOT given an image resource
       hint here. It helped the dashboard, where that slide is the LCP element
       and lives inside the JS bundle - but this one HTML file serves every
       route, so the browser also fetched the 1440w variant (219KB) on kit
       pages, tool pages and LMS-embedded kits, discarded it unused, and logged
       "preloaded but not used" each time. One route's faster paint was not
       worth that download on all the others. The preconnect above keeps the
       Cloudinary connection warm everywhere, which is the part that
       generalises. If the dashboard LCP needs attention again, measure first. -->
</head>

<body class="min-h-screen antialiased">
  <div id="root"></div>
  <script>
    // Restore a deep link that public/404.html stashed on its way through
    // GitHub Pages' 404 handler. Must run before React mounts so the router
    // sees the real path.
    (function () {
      try {
        var target = sessionStorage.getItem('titan-spa-redirect');
        if (target) {
          sessionStorage.removeItem('titan-spa-redirect');
          history.replaceState(null, '', target);
        }
      } catch (e) {
        // Storage blocked - stay on the dashboard.
      }
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
