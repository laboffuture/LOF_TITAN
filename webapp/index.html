<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOF TITAN Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-900 text-white min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script>
      // Restore a deep link that public/404.html stashed on its way through
      // GitHub Pages' 404 handler. Must run before React mounts so the router
      // sees the real path.
      (function () {
        try {
          var target = sessionStorage.getItem('titan-spa-redirect');
          if (target) {
            sessionStorage.removeItem('titan-spa-redirect');
            history.replaceState(null, '', target);
          }
        } catch (e) {
          // Storage blocked - stay on the dashboard.
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
